<button mat-button class="help-button" [matMenuTriggerFor]="helpMenu" title="Help and information">
    <i class="fa fa-2x fa-info-circle" aria-hidden="true"></i>
    <i class="fa fa-caret-down" style="margin-left:5px;" aria-hidden="true"></i>
</button>
<mat-menu #helpMenu="matMenu" style="margin-top: 12px;">
    <!-- About us -->
    <a mat-menu-item class="menu-link" href="https://www.auscope.org.au/" target="_blank">
        <i class="ti-home menu-icon" aria-hidden="true"></i>
        <span>About</span>
    </a>
    <!-- User Guide -->
    <a mat-menu-item class="menu-link" href="https://github.com/AuScope/AuScope-Portal-UI/raw/master/docs/AuScopeUserGuide.pdf" target="_blank">
        <i class="ti-info-alt menu-icon" aria-hidden="true"></i>
        <span>User Guide</span>
    </a>
    <!-- Contact us -->
    <a mat-menu-item class="menu-link" href="mailto:cg-admin@csiro.au?Subject=Auscope-portal" target="_blank">
        <i class="ti-email menu-icon" aria-hidden="true"></i>
        <span>Contact us</span>
    </a>
    <!-- Cite us -->
    <a mat-menu-item class="menu-link" href="http://hdl.handle.net/102.100.100/483116?index=1" target="_blank">
        <i class="ti-pencil menu-icon" aria-hidden="true"></i>
        <span>Cite us</span>
    </a>
    <!-- AuScope-Cat -->
    <a mat-menu-item class="menu-link" href="https://auscope.github.io/AuScope-Cat" target="_blank">
        <i class="fa fa-plug menu-icon" aria-hidden="true"></i>
        <div class="menu-text">
            <span class="menu-title">AuScope-Cat</span>
            <span class="menu-subtext">Access data using a Python API</span>
        </div>
    </a>
    <!-- App Store -->
    <a mat-menu-item class="menu-link" href="https://avre.auscope.org/" target="_blank">
        <i class="fa fa-th menu-icon" aria-hidden="true"></i>
        <div class="menu-text">
            <span class="menu-title">AuScope Tools</span>
            <span class="menu-subtext">
                Browse other AuScope applications, software and models
            </span>
        </div>
    </a>
    <!-- Portal release version and link to disclaimer -->
    <button mat-menu-item class="portal-version" (click)="openDisclaimerModal()">
        <div style="display:flex;flex-direction:column;">
            <span>Auscope Portal {{ currentVersion + devSuffix }}</span>
            <span class="disclaimer-link">Disclaimer</span>
        </div>
    </button>

</mat-menu>
