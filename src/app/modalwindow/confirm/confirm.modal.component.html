	<div class="modal-header">
		<h4 style="margin:1rem 0 0 1.5rem;">{{ data.title }}</h4><button class="btn btn-sm btn-outline" aria-label="Close" style="margin-left:auto;" (click)="dialogRef.close()"><i class="fa fa-times"></i></button>
	</div>
	<div class="modal-body" style="margin:1rem;">
		{{ data.modalContent }}
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-outline-secondary" style="margin:1rem;" (click)="dialogRef.close('CANCEL')">{{ data.cancelButtonText }}</button>
		<button type="button" class="btn btn-primary" style="margin:1rem;" (click)="dialogRef.close('OK')">{{ data.confirmButtonText }}</button>
	</div>
