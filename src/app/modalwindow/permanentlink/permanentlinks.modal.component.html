<div class="modal-header">
  <h4 style="margin:1rem 0 0 1.5rem;">States</h4><button class="btn btn-sm btn-outline" aria-label="Close" style="margin:1rem 1rem 0 auto" (click)="dialogRef.close()"><i class="fa fa-times"></i></button>
</div>
<mat-dialog-content>
  <div class="modal-body">
    <form [formGroup]="statesForm" class="text-start">

      <div formArrayName="states">

      @for (state of statesFormArray.controls; track state; let i = $index) {
        <div class="state-group">
          <div class="form-group" [formGroupName]="i">
            <div class="form-pair">
              <label class="form-label" for="name">Name</label>
              <input id="name" formControlName="name" class="form-control" placeholder="Name" type="text">
            </div>
            <div class="form-pair">
              <label class="form-label" for="date">Date</label>
              <input id="date" formControlName="date" class="form-control" type="text">
            </div>
            <div class="form-pair">
              <label class="form-label" for="description">Description</label>
              <input id="description" formControlName="description" class="form-control" placeholder="Description" type="text">
            </div>
            <div class="form-pair">
              <label class="form-label" for="link">Link</label>
              <div class="input-group">
                <input id="link" formControlName="link" class="form-control" type="text">
                <button for="link" class="btn btn-primary" title="Copy to Clipboard" ngxClipboard [cbContent]="state.get('link')?.value" type="button">
                  <i class="far fa-copy"></i>
                </button>
              </div>
            </div>
            <div class="form-pair">
              <label class="form-label" for="isPublic">Is Public</label>
              <input id="isPublic" formControlName="isPublic" style="width:auto;margin-right:auto;" type="checkbox">
            </div>
          </div>
          <button class="btn btn-sm btn-primary state-form-button float-end" (click)="loadState(i)"><a #loadStateLink class="state-link" href="/?state={{userStates[i].id}}"><i class="fa fa-refresh"></i>&nbsp;Load State</a></button>
          <button class="btn btn-sm btn-primary state-form-button float-end" (click)="deleteState(i)"><i class="fa fa-trash"></i>&nbsp;Delete</button>
          @if (editingState !== i) {
            <button class="btn btn-sm btn-primary state-form-button float-end" (click)="editState(i)"><i class="fa fa-pencil"></i>&nbsp;Edit</button>
          }
          @if (editingState === i) {
            <button class="btn btn-sm btn-primary state-form-button float-end" (click)="saveState(i)"><i class="fa fa-save"></i>&nbsp;Save Changes</button>
          }
        </div>
      }

      </div>

    </form>
  </div>
</mat-dialog-content>
<div class="modal-footer">
  <button class="btn btn-primary" style="margin:1rem;" (click)="close()">Close</button>
</div>
