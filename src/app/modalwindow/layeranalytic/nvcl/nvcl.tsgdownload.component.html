<!-- Modal for querier-->
<div class="modal-header px-4 pt-3" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary="body">
  <h1 class="page-header m-0">TSG Files Download</h1>
</div>

<div class="modal-body px-4" #childElement>
  <div class="card card-default">
    <!-- BEGIN card-body -->
    <div class="card-body">
      <form #f="ngForm">
        <div class="alert alert-danger alert-dismissible">{{data.tsgDownloadServiceMsg}}</div>
        <div>
          <div class="form-group form-group-md row justify-content-start mb-3">
            <label class="col-md-2 col-form-label">Email:</label>
            <div class="col-md-6 d-flex align-items-center">
              <input type="text" class="form-control form-control-sm" [(ngModel)]="tsgform.email" name="email" #email="ngModel" required
                pattern="([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$">
              <span class="validity flex-shrink-0"></span>
            </div>
          </div>
        </div>
        @if (downloadCompleted) {
          <div class="alert alert-success">
            TSG files prepared{{ total > 0 ? ' (' + completed + ' of ' + total + ' files)' : '' }}. 
            You should receive an email shortly with download links.
          </div>
        }

        <div class="d-flex justify-content-start">
          <button (click)="onDownload()" class="btn btn-primary" [disabled]="!email.valid || isDownloading">
            {{ downloadMsg }}
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- END card-body -->
</div>

<div class="modal-footer px-4 pb-3 pt-2">
  <button type="button" class="btn btn-light" (click)="dialogRef.close('Cross click')">Close</button>
</div>
